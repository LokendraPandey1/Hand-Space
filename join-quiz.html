<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Live Quiz - HandSpace</title>
    <link rel="stylesheet" href="style_platform.css">
    <style>
        .join-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .join-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .join-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .join-card h1 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .join-card p {
            color: #888;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #f472b6;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.2);
        }

        .code-input {
            font-family: monospace;
            font-size: 2rem !important;
            letter-spacing: 12px;
            text-align: center;
            text-transform: uppercase;
        }

        .code-input::placeholder {
            letter-spacing: 5px;
            font-size: 1.5rem;
        }

        .btn-join {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.4);
        }

        .btn-join:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #f472b6;
        }
    </style>
</head>

<body class="platform-page">

    <div class="join-container">
        <div class="join-card">
            <div class="join-icon">🎮</div>
            <h1>Join Live Quiz</h1>
            <p>Enter the session code shared by your host</p>

            <div class="error-message" id="error-message"></div>

            <div class="input-group">
                <label>Session Code</label>
                <input type="text" id="session-code" class="code-input" placeholder="------" maxlength="6"
                    autocomplete="off">
            </div>

            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="player-name" placeholder="Enter your name" maxlength="30">
            </div>

            <button class="btn-join" id="btn-join" disabled>
                🚀 Join Quiz
            </button>

            <a href="quiz.html" class="back-link">← Back to Quizzes</a>
        </div>
    </div>

    <script>
        const codeInput = document.getElementById('session-code');
        const nameInput = document.getElementById('player-name');
        const btnJoin = document.getElementById('btn-join');
        const errorMessage = document.getElementById('error-message');

        // Auto-focus
        codeInput.focus();

        // Format code input
        codeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
            validateForm();
        });

        nameInput.addEventListener('input', validateForm);

        function validateForm() {
            const code = codeInput.value.trim();
            const name = nameInput.value.trim();
            btnJoin.disabled = !(code.length === 6 && name.length >= 2);
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        btnJoin.addEventListener('click', async () => {
            hideError();

            const code = codeInput.value.trim();
            const name = nameInput.value.trim();

            // Check if session exists (localStorage for demo, API in production)
            const session = localStorage.getItem(`live_quiz_${code}`);

            if (!session) {
                showError('Session not found. Please check the code and try again.');
                return;
            }

            const sessionData = JSON.parse(session);

            if (sessionData.status === 'ended') {
                showError('This session has already ended.');
                return;
            }

            // Add participant to session
            const participants = sessionData.participants || [];
            const existingIndex = participants.findIndex(p => p.name === name);

            if (existingIndex >= 0) {
                // Update existing participant
                participants[existingIndex].lastSeen = Date.now();
            } else {
                // Add new participant
                participants.push({
                    name: name,
                    score: 0,
                    answered: 0,
                    joinedAt: Date.now(),
                    lastSeen: Date.now()
                });
            }

            sessionData.participants = participants;
            localStorage.setItem(`live_quiz_${code}`, JSON.stringify(sessionData));

            // Store player info
            sessionStorage.setItem('live_quiz_player', JSON.stringify({
                name: name,
                code: code
            }));

            // Redirect to live quiz page
            window.location.href = `live-quiz.html?code=${code}`;
        });

        // Enter key support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !btnJoin.disabled) {
                btnJoin.click();
            }
        });
    </script>
</body>

</html>
