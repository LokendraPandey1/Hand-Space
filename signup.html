<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandSpace - Sign Up</title>
    <link rel="stylesheet" href="style_platform.css">
    <script type="module">
        import { Auth } from './src/auth/auth.js';

        window.onload = () => {
            // Role selector
            let selectedRole = 'student';
            const roleInput = document.getElementById('role');
            document.querySelectorAll('.role-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    selectedRole = opt.dataset.role;
                    roleInput.value = selectedRole;
                });
            });

            const form = document.getElementById('signup-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = form.querySelector('button[type="submit"]');
                btn.textContent = 'Creating account...';
                btn.disabled = true;

                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;

                try {
                    const result = await Auth.signup(name, email, password, role);
                    if (result.success) {
                        btn.textContent = 'Welcome aboard!';
                        setTimeout(() => window.location.href = 'dashboard.html', 500);
                    } else {
                        const msg = result.message || ("Error: " + JSON.stringify(result));
                        showError(msg);
                        btn.textContent = 'Create Account';
                        btn.disabled = false;
                    }
                } catch (err) {
                    showError("Connection error: " + err.message);
                    btn.textContent = 'Create Account';
                    btn.disabled = false;
                }
            });
        };

        function showError(msg) {
            let errEl = document.getElementById('signup-error');
            if (!errEl) {
                errEl = document.createElement('div');
                errEl.id = 'signup-error';
                errEl.style.cssText = 'background: var(--danger-subtle); border: 1px solid var(--danger); color: var(--danger); padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; text-align: center; margin-top: 10px;';
                document.getElementById('signup-form').appendChild(errEl);
            }
            errEl.textContent = msg;
        }
    </script>
</head>

<body class="platform-page">

    <div class="auth-container">
        <!-- Left Hero -->
        <div class="auth-hero">
            <div class="auth-hero-icon">&#x1F31F;</div>
            <h2>Start your journey</h2>
            <p>Join thousands of students exploring science through interactive 3D learning.</p>

            <div class="hero-stats-grid">
                <div class="hero-stat-card">
                    <div class="stat-num" style="color: var(--primary);">40+</div>
                    <div class="stat-label">3D Models</div>
                </div>
                <div class="hero-stat-card">
                    <div class="stat-num" style="color: var(--secondary);">5</div>
                    <div class="stat-label">Categories</div>
                </div>
                <div class="hero-stat-card">
                    <div class="stat-num" style="color: var(--accent);">7</div>
                    <div class="stat-label">Languages</div>
                </div>
                <div class="hero-stat-card">
                    <div class="stat-num" style="color: var(--primary);">AI</div>
                    <div class="stat-label">Powered</div>
                </div>
            </div>
        </div>

        <!-- Right Form -->
        <div class="auth-form-side">
            <div class="auth-form">
                <h2 class="auth-form-title">Join HandSpace</h2>
                <p class="auth-form-subtitle">Create your free account</p>

                <form id="signup-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" class="form-input" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Min 6 characters" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label>I am a...</label>
                        <input type="hidden" id="role" value="student">
                        <div class="role-selector">
                            <div class="role-option selected" data-role="student">
                                &#x1F393; Student
                            </div>
                            <div class="role-option" data-role="teacher">
                                &#x1F468;&#x200D;&#x1F3EB; Teacher
                            </div>
                            <div class="role-option" data-role="university">
                                &#x1F3EB; School
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Create Account</button>
                </form>

                <div class="auth-links">
                    Already have an account? <a href="login.html">Log In</a>
                </div>
                <div class="auth-links" style="margin-top: 8px;">
                    <a href="home.html" style="color: var(--text-muted);">&#x2190; Back to Home</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
