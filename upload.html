<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Model - HandSpace</title>
    <link rel="stylesheet" href="style_platform.css">
    <style>
        .upload-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            padding-top: 100px;
        }

        .upload-form {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
        }

        .form-group select option {
            background: #1a1a2e;
            color: #fff;
        }

        .file-upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload-area:hover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.05);
        }

        .file-upload-area.dragover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
        }

        .file-upload-area.has-file {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .file-upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .file-upload-text {
            color: #888;
            margin-bottom: 5px;
        }

        .file-upload-hint {
            color: #666;
            font-size: 12px;
        }

        .file-name {
            color: #4ade80;
            font-weight: 500;
            margin-top: 10px;
        }

        .btn-upload {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
        }

        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .upload-progress {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            width: 0%;
            transition: width 0.3s;
        }

        .upload-status {
            text-align: center;
            margin-top: 10px;
            color: #888;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid rgba(74, 222, 128, 0.5);
            color: #4ade80;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }

        .my-models {
            margin-top: 40px;
        }

        .my-models h3 {
            color: #fff;
            margin-bottom: 20px;
        }

        .model-list {
            display: grid;
            gap: 15px;
        }

        .model-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-info h4 {
            color: #fff;
            margin: 0 0 5px 0;
        }

        .model-info span {
            color: #888;
            font-size: 12px;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.4);
        }
    </style>
</head>

<body class="platform-page">

    <!-- Navbar -->
    <nav class="main-navbar">
        <a href="dashboard.html" class="nav-brand">
            <span>✋ HandSpace</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
            <a href="library.html" class="nav-link">📚 Library</a>
            <a href="index.html" class="nav-link">🧊 3D Viewer</a>
            <a href="upload.html" class="nav-link active">📤 Upload</a>
            <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2); margin: 0 10px;"></div>

            <!-- User Section -->
            <a href="profile.html" class="nav-link" style="display:flex; align-items:center; gap:8px;">
                👤 <span id="nav-user-name">User</span>
            </a>
            <a href="#" id="nav-logout" class="nav-link" style="color:#ff6b6b;">Logout</a>
        </div>
    </nav>

    <div class="upload-container">
        <h2 style="color: #fff; margin-bottom: 30px; text-align: center;">📤 Upload 3D Model</h2>

        <div id="alert-success" class="alert alert-success">
            ✅ Model uploaded successfully!
        </div>
        <div id="alert-error" class="alert alert-error">
            ❌ <span id="error-text">Error uploading model</span>
        </div>

        <form id="upload-form" class="upload-form">
            <div class="form-group">
                <label for="model-name">Model Name *</label>
                <input type="text" id="model-name" placeholder="e.g., Human Brain" required>
            </div>

            <div class="form-group">
                <label for="model-category">Category *</label>
                <select id="model-category" required>
                    <option value="">Select Category</option>
                    <option value="Anatomy">Anatomy</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Earth Science">Earth Science</option>
                    <option value="Space">Space</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="model-description">Description</label>
                <textarea id="model-description" rows="3" placeholder="Brief description of the model..."></textarea>
            </div>

            <div class="form-group">
                <label>3D Model File (.glb or .gltf) *</label>
                <div id="file-upload-area" class="file-upload-area">
                    <div class="file-upload-icon">📁</div>
                    <div class="file-upload-text">Drag & drop your file here</div>
                    <div class="file-upload-hint">or click to browse (Max 50MB)</div>
                    <div id="file-name" class="file-name"></div>
                </div>
                <input type="file" id="model-file" accept=".glb,.gltf" hidden>
            </div>

            <button type="submit" id="btn-submit" class="btn-upload" disabled>
                Upload Model
            </button>

            <div id="upload-progress" class="upload-progress">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div id="upload-status" class="upload-status">Uploading...</div>
            </div>
        </form>

        <div class="my-models">
            <h3>📦 My Uploaded Models</h3>
            <div id="model-list" class="model-list">
                <p style="color: #888; text-align: center;">Loading...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { Auth } from './src/auth/auth.js';

        // Check auth
        if (!Auth.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        // Update navbar user name
        const user = Auth.getUser();
        document.getElementById('nav-user-name').textContent = user?.name?.split(' ')[0] || 'User';

        // Logout
        document.getElementById('nav-logout').onclick = (e) => {
            e.preventDefault();
            Auth.logout();
            window.location.href = 'login.html';
        };

        // Elements
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('model-file');
        const uploadArea = document.getElementById('file-upload-area');
        const fileNameDisplay = document.getElementById('file-name');
        const submitBtn = document.getElementById('btn-submit');
        const progressDiv = document.getElementById('upload-progress');
        const progressFill = document.getElementById('progress-fill');
        const uploadStatus = document.getElementById('upload-status');
        const alertSuccess = document.getElementById('alert-success');
        const alertError = document.getElementById('alert-error');
        const errorText = document.getElementById('error-text');

        let selectedFile = null;

        // File upload area click
        uploadArea.onclick = () => fileInput.click();

        // File selection
        fileInput.onchange = (e) => {
            handleFile(e.target.files[0]);
        };

        // Drag and drop
        uploadArea.ondragover = (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        };

        uploadArea.ondragleave = () => {
            uploadArea.classList.remove('dragover');
        };

        uploadArea.ondrop = (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        };

        function handleFile(file) {
            if (!file) return;

            const ext = file.name.split('.').pop().toLowerCase();
            if (!['glb', 'gltf'].includes(ext)) {
                showError('Only .glb and .gltf files are allowed');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showError('File size must be under 50MB');
                return;
            }

            selectedFile = file;
            fileNameDisplay.textContent = `📄 ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            uploadArea.classList.add('has-file');
            submitBtn.disabled = false;
        }

        // Form submit
        form.onsubmit = async (e) => {
            e.preventDefault();
            hideAlerts();

            const name = document.getElementById('model-name').value.trim();
            const category = document.getElementById('model-category').value;
            const description = document.getElementById('model-description').value.trim();

            if (!name || !category || !selectedFile) {
                showError('Please fill all required fields');
                return;
            }

            submitBtn.disabled = true;
            progressDiv.style.display = 'block';

            const formData = new FormData();
            formData.append('name', name);
            formData.append('category', category);
            formData.append('description', description);
            formData.append('model', selectedFile);

            try {
                const xhr = new XMLHttpRequest();

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = (e.loaded / e.total) * 100;
                        progressFill.style.width = percent + '%';
                        uploadStatus.textContent = `Uploading... ${percent.toFixed(0)}%`;
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 201) {
                        showSuccess();
                        resetForm();
                        loadMyModels();
                    } else {
                        const res = JSON.parse(xhr.responseText);
                        showError(res.error || 'Upload failed');
                    }
                    progressDiv.style.display = 'none';
                    submitBtn.disabled = false;
                };

                xhr.onerror = () => {
                    showError('Network error');
                    progressDiv.style.display = 'none';
                    submitBtn.disabled = false;
                };

                xhr.open('POST', '/api/models/upload');
                xhr.setRequestHeader('Authorization', `Bearer ${Auth.getToken()}`);
                xhr.send(formData);
            } catch (err) {
                showError(err.message);
                progressDiv.style.display = 'none';
                submitBtn.disabled = false;
            }
        };

        function resetForm() {
            form.reset();
            selectedFile = null;
            fileNameDisplay.textContent = '';
            uploadArea.classList.remove('has-file');
            submitBtn.disabled = true;
            progressFill.style.width = '0%';
        }

        function showSuccess() {
            alertSuccess.style.display = 'block';
            setTimeout(() => alertSuccess.style.display = 'none', 5000);
        }

        function showError(msg) {
            errorText.textContent = msg;
            alertError.style.display = 'block';
            setTimeout(() => alertError.style.display = 'none', 5000);
        }

        function hideAlerts() {
            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';
        }

        // Load user's models
        async function loadMyModels() {
            const listEl = document.getElementById('model-list');

            try {
                const res = await fetch('/api/models/my-models', {
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
                });

                const models = await res.json();

                if (models.length === 0) {
                    listEl.innerHTML = '<p style="color: #888; text-align: center;">No models uploaded yet</p>';
                    return;
                }

                listEl.innerHTML = models.map(m => `
                    <div class="model-item">
                        <div class="model-info">
                            <h4>${m.name}</h4>
                            <span>${m.category} • ${new Date(m.createdAt).toLocaleDateString()}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteModel('${m._id}')">🗑️ Delete</button>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = '<p style="color: #ef4444;">Failed to load models</p>';
            }
        }

        // Make delete global
        window.deleteModel = async (id) => {
            if (!confirm('Are you sure you want to delete this model?')) return;

            try {
                const res = await fetch(`/api/models/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
                });

                if (res.ok) {
                    loadMyModels();
                } else {
                    const data = await res.json();
                    showError(data.error);
                }
            } catch (err) {
                showError('Failed to delete model');
            }
        };

        // Load models on page load
        loadMyModels();
    </script>
</body>

</html>
