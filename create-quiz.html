<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - HandSpace</title>
    <link rel="stylesheet" href="style_platform.css">
    <style>
        .create-quiz-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
        }

        .quiz-form {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h3 {
            color: #00f2fe;
            margin-bottom: 15px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ddd;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Questions Section */
        .questions-container {
            margin-top: 20px;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
        }

        .question-card.editing {
            border-color: #00f2fe;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-number {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0a0a1a;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .question-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.1rem;
        }

        .btn-edit {
            background: rgba(79, 172, 254, 0.2);
            color: #4facfe;
        }

        .btn-edit:hover {
            background: rgba(79, 172, 254, 0.4);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .option-item.correct {
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .option-item input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #4ade80;
        }

        .option-item input[type="text"] {
            flex: 1;
        }

        .btn-add-question {
            width: 100%;
            padding: 20px;
            background: rgba(0, 242, 254, 0.1);
            border: 2px dashed rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            color: #00f2fe;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-add-question:hover {
            background: rgba(0, 242, 254, 0.2);
            border-color: #00f2fe;
        }

        /* Submit Button */
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-submit {
            flex: 1;
            padding: 16px 30px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 10px;
            color: #0a0a1a;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-cancel {
            padding: 16px 30px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #aaa;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .toast.error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* Question count badge */
        .question-count {
            background: rgba(0, 242, 254, 0.2);
            color: #00f2fe;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .create-quiz-container {
                padding: 15px;
            }

            .quiz-form {
                padding: 25px;
            }
        }
    </style>
</head>

<body class="platform-page">

    <!-- Navbar -->
    <nav class="main-navbar">
        <a href="dashboard.html" class="nav-brand">
            <span>✋ HandSpace</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="library.html">📚 Library</a>
            <a href="quiz.html">📝 Quizzes</a>
            <a href="index.html">🌐 3D Viewer</a>
        </div>
        <div class="nav-actions">
            <span id="user-name" class="user-greeting">Teacher</span>
            <button id="btn-logout" class="btn-logout">Logout</button>
        </div>
    </nav>

    <div class="create-quiz-container">
        <form class="quiz-form" id="create-quiz-form">
            <div class="form-header">
                <h1>📝 Create New Quiz</h1>
                <p>Build an interactive quiz for your students</p>
            </div>

            <!-- Basic Info Section -->
            <div class="form-section">
                <h3>📋 Quiz Details</h3>

                <div class="form-group">
                    <label for="quiz-title">Quiz Title *</label>
                    <input type="text" id="quiz-title" placeholder="e.g., Human Heart Anatomy Quiz" required>
                </div>

                <div class="form-group">
                    <label for="quiz-description">Description</label>
                    <textarea id="quiz-description" placeholder="Describe what this quiz covers..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="quiz-category">Category *</label>
                        <select id="quiz-category" required>
                            <option value="">Select Category</option>
                            <option value="Anatomy">🏥 Anatomy</option>
                            <option value="Chemistry">🧪 Chemistry</option>
                            <option value="Earth Science">🌍 Earth Science</option>
                            <option value="Space">🌌 Space</option>
                            <option value="Engineering">⚙️ Engineering</option>
                            <option value="General">📚 General</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quiz-difficulty">Difficulty</label>
                        <select id="quiz-difficulty">
                            <option value="Easy">🟢 Easy</option>
                            <option value="Medium" selected>🟡 Medium</option>
                            <option value="Hard">🔴 Hard</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="quiz-time">Time Limit (minutes)</label>
                        <input type="number" id="quiz-time" value="10" min="1" max="120">
                    </div>

                    <div class="form-group">
                        <label for="quiz-model">Associated 3D Model (optional)</label>
                        <select id="quiz-model">
                            <option value="">No model</option>
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- Questions Section -->
            <div class="form-section">
                <h3>
                    ❓ Questions
                    <span class="question-count" id="question-count">0 questions</span>
                </h3>

                <div class="questions-container" id="questions-container">
                    <!-- Questions will be added here -->
                </div>

                <button type="button" class="btn-add-question" id="btn-add-question">
                    ➕ Add Question
                </button>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
                <button type="submit" class="btn-submit" id="btn-submit">
                    🚀 Create Quiz
                </button>
            </div>
        </form>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Question Template (Hidden) -->
    <template id="question-template">
        <div class="question-card" data-question-index="">
            <div class="question-header">
                <span class="question-number">Question #</span>
                <div class="question-actions">
                    <button type="button" class="btn-icon btn-delete" title="Delete Question">🗑️</button>
                </div>
            </div>

            <div class="form-group">
                <label>Question Text *</label>
                <input type="text" class="question-text" placeholder="Enter your question..." required>
            </div>

            <div class="form-group">
                <label>Options (Select the correct answer)</label>
                <div class="options-list">
                    <div class="option-item">
                        <input type="radio" name="correct-0" value="0" checked>
                        <input type="text" class="option-text" placeholder="Option A" required>
                    </div>
                    <div class="option-item">
                        <input type="radio" name="correct-0" value="1">
                        <input type="text" class="option-text" placeholder="Option B" required>
                    </div>
                    <div class="option-item">
                        <input type="radio" name="correct-0" value="2">
                        <input type="text" class="option-text" placeholder="Option C" required>
                    </div>
                    <div class="option-item">
                        <input type="radio" name="correct-0" value="3">
                        <input type="text" class="option-text" placeholder="Option D" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Explanation (shown after answering)</label>
                <textarea class="question-explanation"
                    placeholder="Explain why this is the correct answer..."></textarea>
            </div>
        </div>
    </template>

    <script type="module">
        import { Auth } from './src/auth/auth.js';
        import { MODELS } from './src/models/modelLoader.js';

        // Check auth
        Auth.requireAuth();

        // Check if user is a teacher or university account
        if (!Auth.isTeacher() && !Auth.isUniversity()) {
            alert('Only teachers and university accounts can create quizzes.');
            window.location.href = 'dashboard.html';
        }

        // Display user info
        const user = Auth.getCurrentUser();
        if (user) {
            document.getElementById('user-name').textContent = `👨‍🏫 ${user.name}`;
        }

        // Logout
        document.getElementById('btn-logout').addEventListener('click', () => {
            Auth.logout();
        });

        // Populate model dropdown
        const modelSelect = document.getElementById('quiz-model');
        MODELS.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.file;
            opt.textContent = `${m.name} (${m.category})`;
            modelSelect.appendChild(opt);
        });

        // Questions management
        let questionCount = 0;
        const questionsContainer = document.getElementById('questions-container');
        const questionTemplate = document.getElementById('question-template');
        const questionCountBadge = document.getElementById('question-count');

        function updateQuestionCount() {
            const count = questionsContainer.querySelectorAll('.question-card').length;
            questionCountBadge.textContent = `${count} question${count !== 1 ? 's' : ''}`;
        }

        function addQuestion() {
            const clone = questionTemplate.content.cloneNode(true);
            const card = clone.querySelector('.question-card');

            // Set unique index
            card.dataset.questionIndex = questionCount;
            card.querySelector('.question-number').textContent = `Question ${questionCount + 1}`;

            // Update radio button names for this question
            const radios = card.querySelectorAll('input[type="radio"]');
            radios.forEach(r => r.name = `correct-${questionCount}`);

            // Highlight selected option
            radios.forEach(r => {
                r.addEventListener('change', () => {
                    card.querySelectorAll('.option-item').forEach(item => item.classList.remove('correct'));
                    r.closest('.option-item').classList.add('correct');
                });
            });

            // Mark first option as correct by default
            card.querySelector('.option-item').classList.add('correct');

            // Delete button
            card.querySelector('.btn-delete').addEventListener('click', () => {
                card.remove();
                renumberQuestions();
                updateQuestionCount();
            });

            questionsContainer.appendChild(card);
            questionCount++;
            updateQuestionCount();

            // Scroll to new question
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function renumberQuestions() {
            const cards = questionsContainer.querySelectorAll('.question-card');
            cards.forEach((card, idx) => {
                card.dataset.questionIndex = idx;
                card.querySelector('.question-number').textContent = `Question ${idx + 1}`;
                const radios = card.querySelectorAll('input[type="radio"]');
                radios.forEach(r => r.name = `correct-${idx}`);
            });
        }

        document.getElementById('btn-add-question').addEventListener('click', addQuestion);

        // Add first question by default
        addQuestion();

        // Form submission
        const form = document.getElementById('create-quiz-form');
        const toast = document.getElementById('toast');

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('btn-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Creating...';

            try {
                // Collect quiz data
                const title = document.getElementById('quiz-title').value.trim();
                const description = document.getElementById('quiz-description').value.trim();
                const category = document.getElementById('quiz-category').value;
                const difficulty = document.getElementById('quiz-difficulty').value;
                const timeLimit = parseInt(document.getElementById('quiz-time').value);
                const modelFile = document.getElementById('quiz-model').value;

                // Collect questions
                const questionCards = questionsContainer.querySelectorAll('.question-card');
                const questions = [];

                for (const card of questionCards) {
                    const questionText = card.querySelector('.question-text').value.trim();
                    const optionInputs = card.querySelectorAll('.option-text');
                    const options = Array.from(optionInputs).map(i => i.value.trim());
                    const correctRadio = card.querySelector('input[type="radio"]:checked');
                    const correctAnswer = parseInt(correctRadio.value);
                    const explanation = card.querySelector('.question-explanation').value.trim();

                    if (!questionText) {
                        showToast('Please fill in all question texts', 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = '🚀 Create Quiz';
                        return;
                    }

                    if (options.some(o => !o)) {
                        showToast('Please fill in all options', 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = '🚀 Create Quiz';
                        return;
                    }

                    questions.push({
                        question: questionText,
                        options,
                        correctAnswer,
                        explanation
                    });
                }

                if (questions.length === 0) {
                    showToast('Please add at least one question', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '🚀 Create Quiz';
                    return;
                }

                // Submit to API
                const res = await fetch('/api/quizzes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${Auth.getToken()}`
                    },
                    body: JSON.stringify({
                        title,
                        description,
                        category,
                        difficulty,
                        timeLimit,
                        modelFile,
                        questions
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast('✅ Quiz created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'quiz.html';
                    }, 1500);
                } else {
                    showToast(data.error || 'Failed to create quiz', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '🚀 Create Quiz';
                }

            } catch (err) {
                console.error('Error:', err);
                showToast('Failed to create quiz. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Create Quiz';
            }
        });
    </script>

</body>

</html>
